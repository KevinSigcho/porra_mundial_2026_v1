name: Sync football results

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probar sin guardar resultados"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  schedule:
    # Horarios en UTC.
    # España peninsular en junio/julio = UTC+2.
    #
    # 20:15 UTC = 22:15 España
    # 22:15 UTC = 00:15 España
    # 01:15 UTC = 03:15 España
    # 06:30 UTC = 08:30 España
    #
    # El script solo guarda partidos que la API devuelva como FINISHED.
    - cron: "15 20 * 6,7 *"
    - cron: "15 22 * 6,7 *"
    - cron: "15 1 * 6,7 *"
    - cron: "30 5 * 6,7 *"
jobs:
  sync-results:
    name: Sync results
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run sync script
        env:
          PORRA_APP_URL: ${{ secrets.PORRA_APP_URL }}
          PORRA_ADMIN_CODE: ${{ secrets.PORRA_ADMIN_CODE }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          FOOTBALL_DATA_COMPETITION: ${{ secrets.FOOTBALL_DATA_COMPETITION }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node scripts/sync-results.js
